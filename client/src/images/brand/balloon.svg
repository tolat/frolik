<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Frolik balloon: same shapes and palette as the original flat icon,
       with gradients, a glossy dome, soft panel shadows and a drop shadow -->
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6ecbd"/>
      <stop offset="0.55" stop-color="#74d493"/>
      <stop offset="1" stop-color="#3fae6a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7899f"/>
      <stop offset="1" stop-color="#d9445f"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.6" stop-color="#fde074"/>
      <stop offset="1" stop-color="#f2c13a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aedcff"/>
      <stop offset="1" stop-color="#5ba8ec"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7eaf0"/>
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e7d6"/>
      <stop offset="1" stop-color="#cdb594"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- slight shadow each coloured panel casts (the "depth" between parts) -->
    <filter id="panel" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b1d24" flood-opacity="0.16"/>
    </filter>
    <filter id="drop" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1b1d24" flood-opacity="0.18"/>
    </filter>
    <clipPath id="domeClip">
      <path d="M122 214 A134 134 0 0 1 390 214 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#drop)">
    <!-- lower envelope: just the three coloured panels, with empty space
         between them (no white ribs) -->
    <g filter="url(#panel)">
      <path d="M124 228 L180 228 C184 292 214 330 236 374 C212 330 124 300 124 228 Z" fill="url(#red)"/>
      <path d="M392 228 L332 228 C328 292 298 330 276 374 C300 330 392 300 392 228 Z" fill="url(#blue)"/>
      <path d="M208 228 L304 228 C300 286 270 318 256 354 C242 318 212 286 208 228 Z" fill="url(#yellow)"/>
    </g>
    <!-- soft shine down the left of each lower panel -->
    <path d="M136 240 C142 280 176 312 206 342" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M222 240 C226 272 238 296 250 318" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M344 240 C340 270 326 296 306 320" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- dome -->
    <g filter="url(#panel)">
      <path d="M122 214 A134 134 0 0 1 390 214 Z" fill="url(#dome)"/>
    </g>
    <g clip-path="url(#domeClip)">
      <!-- seam + rim shading -->
      <path d="M256 80 L256 214" stroke="#3fa466" stroke-opacity="0.18" stroke-width="3"/>
      <ellipse cx="256" cy="232" rx="150" ry="36" fill="#1b1d24" fill-opacity="0.08"/>
      <!-- gloss -->
      <ellipse cx="204" cy="126" rx="96" ry="58" fill="url(#gloss)"/>
      <ellipse cx="176" cy="112" rx="26" ry="13" fill="#ffffff" fill-opacity="0.55" transform="rotate(-24 176 112)"/>
    </g>

    <!-- band -->
    <g filter="url(#panel)">
      <rect x="113" y="201" width="286" height="28" rx="9" fill="url(#band)"/>
    </g>
    <rect x="121" y="204" width="270" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.9"/>

    <!-- basket -->
    <g filter="url(#panel)">
      <rect x="212" y="380" width="92" height="54" rx="10" fill="url(#basket)"/>
    </g>
    <rect x="212" y="380" width="92" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <path d="M224 404 H292 M224 418 H292" stroke="#b79d79" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
